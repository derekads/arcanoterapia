<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arcanoterapia</title>

  <!-- Fonts: Cinzel for headings (Mystical), Lato for body (Clean) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;800&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Lato:wght@300;400;700&display=swap"
    rel="stylesheet">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Tailwind Config -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serif: ['Cinzel', 'serif'],
            sans: ['Lato', 'sans-serif'],
          },
          colors: {
            'deep-purple': '#1a0b2e',
            'midnight-blue': '#0b1021',
            'mystic-gold': '#D4AF37', // Updated to specific gold requirement
            'neon-cyan': '#22D3EE',
          },
          animation: {
            'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'float': 'float 6s ease-in-out infinite',
            'nebula': 'nebula 15s ease infinite alternate',
            'glow': 'glow 2s ease-in-out infinite alternate',
          },
          keyframes: {
            float: {
              '0%, 100%': { transform: 'translateY(0)' },
              '50%': { transform: 'translateY(-20px)' },
            },
            nebula: {
              '0%': { transform: 'scale(1)', opacity: '0.4' },
              '100%': { transform: 'scale(1.2)', opacity: '0.6' },
            },
            glow: {
              '0%': { boxShadow: '0 0 5px rgba(212,175,55, 0.2)' },
              '100%': { boxShadow: '0 0 20px rgba(212,175,55, 0.6), 0 0 10px rgba(212,175,55, 0.4)' }
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      margin: 0;
      overflow-x: hidden;
      background-color: #0b1021;
    }

    /* Scrollbar Customization for Mystic Tech feel */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #0b1021;
    }

    ::-webkit-scrollbar-thumb {
      background: #D4AF37;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #b5952f;
    }
  </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
    "framer-motion": "https://esm.sh/framer-motion@^12.29.2",
    "clsx": "https://esm.sh/clsx@^2.1.1",
    "astronomy-engine": "https://esm.sh/astronomy-engine@2.1.19",
    "uuid": "https://esm.sh/uuid@9.0.1"
  }
}
</script>
  <link rel="stylesheet" href="/src/index.css">
</head>

<body>
  <div id="root"></div>

</html>
